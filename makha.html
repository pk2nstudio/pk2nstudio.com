<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PK2N Studio - Makha</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:linear-gradient(#668f8f,#70492b);font-family:Georgia,serif;color:#fff}.wrap{max-width:900px;margin:auto}
h1{text-align:center;color:#e7c75c;letter-spacing:5px;margin:4px}.sub{text-align:center;color:#ddd09c;margin-bottom:8px}.lang{text-align:center;margin-bottom:8px}
button{padding:10px 20px;border:2px solid #b8903d;border-radius:8px;background:#302116;color:#f0d36c;cursor:pointer;font-family:Georgia,serif}
.stats{display:flex;justify-content:space-around;background:#291b12;border:2px solid #96702f;border-radius:10px;padding:8px;margin-bottom:8px}.stat{text-align:center}.label{font-size:11px;color:#cdbd91}.num{font-size:22px;color:#f0d36c;font-weight:bold}
#game{position:relative;height:560px;overflow:hidden;border:5px solid #382419;border-radius:12px;background:linear-gradient(#719898 0%,#9da978 54%,#74512f 55%,#674526 100%)}
.m{position:absolute;bottom:170px;width:0;height:0;border-left:210px solid transparent;border-right:210px solid transparent;border-bottom:300px solid #4b5d59;filter:drop-shadow(0 7px 3px #0003)}
.m1{left:-145px;transform:scale(1.08)}.m2{left:25%;transform:scale(1.45)}.m3{right:-145px;transform:scale(1.05)}
.m::after{content:"";position:absolute;left:-34px;bottom:-300px;width:68px;height:190px;background:linear-gradient(145deg,transparent 0 30%,#354945 31% 48%,transparent 49%);transform:rotate(7deg);opacity:.8}
.snow{position:absolute;bottom:382px;width:0;height:0;border-left:58px solid transparent;border-right:58px solid transparent;border-bottom:72px solid #e8ece5;z-index:3;filter:drop-shadow(0 2px 1px #0002)}
.s1{left:7%}.s2{left:44%}.s3{right:7%}
.foothill{position:absolute;bottom:170px;left:-5%;width:110%;height:125px;background:linear-gradient(165deg,transparent 0 22%,#465c50 23% 55%,#3d5147 56% 100%);z-index:4;opacity:.9}
.ridge{position:absolute;bottom:170px;left:-5%;width:110%;height:95px;background:linear-gradient(8deg,#354b41 0 35%,transparent 36%);z-index:5;opacity:.9}
.tree{position:absolute;bottom:168px;width:14px;height:52px;background:#493521;z-index:6}
.tree:before,.tree:after{content:"";position:absolute;left:-18px;border-left:25px solid transparent;border-right:25px solid transparent;border-bottom:45px solid #2f4d3b}
.tree:before{bottom:18px}.tree:after{bottom:35px;transform:scale(.78)}
.t1{left:12%}.t2{left:19%;transform:scale(.8)}.t3{right:17%;transform:scale(.9)}.t4{right:9%;transform:scale(.7)}
.ground{position:absolute;bottom:0;width:100%;height:175px;background:linear-gradient(#765334,#674627 22%,#594020 100%);z-index:7}
.ground:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(25deg,transparent 0 13px,#815d37 14px 17px,transparent 18px 30px);opacity:.55}
.grass{position:absolute;bottom:172px;width:100%;height:18px;background:linear-gradient(#526a4c,#42573f);z-index:8}
#player{position:absolute;left:28px;bottom:42px;width:105px;height:135px;z-index:20;display:flex;align-items:flex-end;justify-content:center}#hero{width:105px;max-height:135px;height:auto;object-fit:contain;display:block}
#bow{position:absolute;left:118px;bottom:102px;width:90px;height:145px;border-left:7px solid #70431f;border-radius:50%;transform:rotate(-8deg);z-index:21}#string{position:absolute;left:42px;top:3px;width:2px;height:140px;background:#eadfc0}
#arrow{position:absolute;left:120px;bottom:172px;width:135px;height:5px;background:#d7b37a;transform-origin:left center;z-index:25;transition:none;box-shadow:0 1px 2px #0005}#arrow:after{content:"";position:absolute;right:-8px;top:-4px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:12px solid #c9c9c9}#arrow:before{content:"";position:absolute;left:-2px;top:-4px;width:10px;height:12px;background:#70431f}
#target{position:absolute;border-radius:50%;border:4px solid #382419;background:radial-gradient(circle,#f2e7c9 0 18%,#8c2920 19% 37%,#f2e7c9 38% 57%,#8c2920 58% 77%,#eee0b9 78%);z-index:10;box-shadow:0 4px 10px #0006}
#message{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 18px;border-radius:20px;color:#f0d36c;z-index:30;white-space:nowrap}
#powerBox{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:300px;padding:9px;background:#1e140ce8;border:2px solid #96702f;border-radius:10px;z-index:30;text-align:center}#powerLabel{font-size:12px;color:#dfc66b;margin-bottom:5px}#powerBar{height:18px;background:#3c332b;border-radius:10px;overflow:hidden}#powerFill{height:100%;width:0%;background:#c79b38}
.controls{text-align:center;margin-top:10px}#fire{background:#773020;color:#fff;font-size:18px;margin-left:6px}.instructions{text-align:center;margin-top:9px;padding:11px;background:#291b12;border:2px solid #8d692e;border-radius:10px;color:#d9c99c;line-height:1.5}.brand{text-align:center;margin-top:12px;padding-top:10px;border-top:1px solid #a98a45;color:#e7c75c;font-size:18px;font-weight:bold;letter-spacing:5px}.brand small{display:block;margin-top:4px;font-size:9px;letter-spacing:2px;color:#cbbd92}
@media(max-width:600px){#game{height:500px}#player{left:8px;width:75px;height:105px}#hero{width:75px;max-height:105px}#bow{left:70px;bottom:94px;transform:scale(.8) rotate(-8deg);transform-origin:bottom left}#arrow{left:85px;bottom:155px;width:100px}#powerBox{width:230px}}
</style>
</head>
<body>
<div class="wrap">
<h1>PK2N STUDIO</h1><div class="sub" id="title">MAKHA • PASHTUN ARCHERY</div><div class="lang"><button id="lang">پښتو</button></div>
<div class="stats"><div class="stat"><div class="label" id="sl">SCORE</div><div class="num" id="score">0</div></div><div class="stat"><div class="label" id="rl">ROUND</div><div class="num" id="round">1 / 10</div></div><div class="stat"><div class="label" id="hl">HITS</div><div class="num" id="hits">0</div></div></div>
<div id="game">
<div class="m m1"></div><div class="m m2"></div><div class="m m3"></div>
<div class="snow s1"></div><div class="snow s2"></div><div class="snow s3"></div>
<div class="foothill"></div><div class="ridge"></div>
<div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div>
<div class="grass"></div><div class="ground"></div>
<div id="message">PRESS START</div><div id="target"></div>
<div id="player"><img id="hero" src="pk2n_hero.png" alt="PK2N Hero"></div>
<div id="bow"><div id="string"></div></div><div id="arrow"></div>
<div id="powerBox"><div id="powerLabel">POWER</div><div id="powerBar"><div id="powerFill"></div></div><div id="aimReadout" style="margin-top:5px;font-size:11px;color:#d9c99c">AIM: 0°</div></div>
</div>
<div class="controls"><button id="start">START GAME</button><button id="fire">AIM • PULL • FIRE</button></div>
<div class="instructions" id="instructions"><b>HOW TO PLAY</b><br>Press START GAME.<br>Hold FIRE! to pull the bow back, then release to shoot.<br>Hit the randomly placed target to earn points.</div>
<div class="brand">PK2N STUDIO<small>MAKHA • PASHTUN GAMES</small></div>
</div>
<script>
const game=document.getElementById("game"),target=document.getElementById("target"),arrow=document.getElementById("arrow"),powerFill=document.getElementById("powerFill"),message=document.getElementById("message"),scoreEl=document.getElementById("score"),hitsEl=document.getElementById("hits"),roundEl=document.getElementById("round"),start=document.getElementById("start"),fire=document.getElementById("fire");
let playing=false,charging=false,power=0,dir=1,timer=null,score=0,hits=0,round=1,lang="en";
const T={en:{button:"پښتو",title:"MAKHA • PASHTUN ARCHERY",score:"SCORE",round:"ROUND",hits:"HITS",power:"POWER",start:"START GAME",fire:"FIRE!",ready:"Aim carefully and fire!",hit:"TARGET HIT! +",miss:"MISSED!",over:"GAME OVER! SCORE: ",instructions:"<b>HOW TO PLAY</b><br>Press START GAME.<br>Hold FIRE! to pull the bow back, then release to shoot.<br>Hit the randomly placed target to earn points."},ps:{button:"English",title:"مخه • پښتني غشي ویشتل",score:"نمرې",round:"پړاو",hits:"لګېدلي",power:"زور",start:"لوبه پیل کړئ",fire:"وویشتئ!",ready:"هدف ونیسئ او غشی وویشتئ!",hit:"هدف ولګېد! +",miss:"خطا!",over:"لوبه ختمه شوه! نمرې: ",instructions:"<b>د لوبې لارښوونې</b><br>لوبه پیل کړئ.<br>د FIRE تڼۍ ونیسئ، بیا یې خوشې کړئ چې غشی وویشتل شي.<br>هدف وولئ او نمرې واخلئ."}};
function placeTarget(){
  const w=game.clientWidth,h=game.clientHeight;
  const size=Math.floor(48+Math.random()*70);
  const minX=Math.min(245,w-size-20);
  const maxX=Math.max(minX,w-size-20);
  const x=minX+Math.random()*(maxX-minX);
  const minY=45;
  const maxY=Math.max(minY+20,h-255);
  const y=minY+Math.random()*(maxY-minY);
  target.style.width=size+"px";
  target.style.height=size+"px";
  target.style.left=x+"px";
  target.style.top=y+"px";
  target.style.display="block";
}
function resetArrow(){
 arrow.style.left="120px";
 arrow.style.bottom="172px";
 arrow.style.transform="rotate(0deg)";
 document.getElementById("string").style.transform="none";
 power=0;dir=1;powerFill.style.width="0%";
}
function startGame(){clearInterval(timer);score=0;hits=0;round=1;playing=true;scoreEl.textContent=0;hitsEl.textContent=0;roundEl.textContent="1 / 10";start.style.display="none";message.textContent=T[lang].ready;placeTarget();resetArrow()}
let aimAngle=0;
let aimStartY=0;

function updateAim(y){
  // Aim is controlled by moving the mouse/finger vertically while holding FIRE.
  // 0° = straight toward the mountain; positive = upward.
  const delta=aimStartY-y;
  aimAngle=Math.max(-28,Math.min(48,delta*0.18));
  document.getElementById("aimReadout").textContent=
    (lang==="en"?"AIM: ":"هدف: ")+Math.round(aimAngle)+"°";

  // Visually rotate the arrow while it is being aimed.
  arrow.style.transform="rotate("+(-aimAngle)+"deg)";
}

function beginCharge(clientY){
 if(!playing||charging)return;
 charging=true;
 power=0;
 dir=1;
 aimStartY=clientY;
 message.textContent=
   lang==="en" ? "Aim at the target • hold to pull • release to fire!" :
                 "هدف ونیسئ، کش یې کړئ او خوشې یې کړئ!";
 timer=setInterval(()=>{
   power+=dir*2;
   if(power>=100){power=100;dir=-1}
   if(power<=0){power=0;dir=1}
   powerFill.style.width=power+"%";

   const pull=power*.72;
   arrow.style.left=(120-pull)+"px";
   arrow.style.bottom=(172-pull*.12)+"px";
 },20);
}

function moveAim(clientY){
 if(!charging)return;
 updateAim(clientY);
}

function releaseShot(){
 if(!charging)return;
 charging=false;
 clearInterval(timer);

 const shotPower=power;
 powerFill.style.width="0%";
 document.getElementById("string").style.transform="none";

 shoot(shotPower,aimAngle);
}

function shoot(p,angleDeg){
 const tr=target.getBoundingClientRect();
 const gr=game.getBoundingClientRect();

 const tx=tr.left-gr.left+tr.width/2;
 const ty=tr.top-gr.top+tr.height/2;

 // Start from the bow, not from the target.
 const sx=120-(p*.72);
 const sy=game.clientHeight-172+(p*.12);

 // The player must actually aim. The target is NOT used to calculate
 // the arrow's direction.
 const angle=(-angleDeg)*Math.PI/180;

 // Stronger pull gives more travel distance.
 const travel=330+(p*5.2);
 const dx=Math.cos(angle)*travel;
 const dy=Math.sin(angle)*travel;

 const endX=sx+dx;
 const endY=sy+dy;

 arrow.style.transform="rotate("+(-angleDeg)+"deg)";

 let progress=0;
 const speed=0.018+(p/100)*0.012;

 function frame(){
   progress+=speed;

   const x=sx+(endX-sx)*progress;
   const y=sy+(endY-sy)*progress;

   arrow.style.left=x+"px";
   arrow.style.bottom=(game.clientHeight-y)+"px";

   // Check for collision during flight, rather than only at the end.
   const ar=arrow.getBoundingClientRect();
   const trNow=target.getBoundingClientRect();

   const ax=ar.left+ar.width/2;
   const ay=ar.top+ar.height/2;
   const txNow=trNow.left+trNow.width/2;
   const tyNow=trNow.top+trNow.height/2;

   if(Math.hypot(ax-txNow,ay-tyNow)<=trNow.width/2+4){
      hitTarget(p);
      return;
   }

   if(progress>=1 || x<-200 || x>game.clientWidth+300 ||
      y<-300 || y>game.clientHeight+300){
      missTarget();
      return;
   }

   requestAnimationFrame(frame);
 }

 frame();
}

function hitTarget(p){
 const points=100+Math.round(p);
 score+=points;
 hits++;
 message.textContent=T[lang].hit+points;
 scoreEl.textContent=score;
 hitsEl.textContent=hits;

 setTimeout(nextRound,700);
}

function missTarget(){
 message.textContent=T[lang].miss;
 setTimeout(nextRound,700);
}

function nextRound(){
 round++;

 if(round>10){
   playing=false;
   message.textContent=T[lang].over+score;
   start.style.display="inline-block";
   return;
 }

 roundEl.textContent=round+" / 10";
 placeTarget();
 resetArrow();
}

fire.addEventListener("mousedown",e=>{
 e.preventDefault();
 beginCharge(e.clientY);
});

document.addEventListener("mousemove",e=>{
 if(charging) moveAim(e.clientY);
});

document.addEventListener("mouseup",()=>{
 if(charging) releaseShot();
});

fire.addEventListener("touchstart",e=>{
 e.preventDefault();
 const y=e.touches[0].clientY;
 beginCharge(y);
},{passive:false});

document.addEventListener("touchmove",e=>{
 if(charging){
   e.preventDefault();
   moveAim(e.touches[0].clientY);
 }
},{passive:false});

document.addEventListener("touchend",e=>{
 if(charging){
   e.preventDefault();
   releaseShot();
 }
},{passive:false});

start.addEventListener("click",startGame);

document.getElementById("lang").addEventListener("click",function(){lang=lang==="en"?"ps":"en";let t=T[lang];this.textContent=t.button;document.getElementById("title").textContent=t.title;document.getElementById("sl").textContent=t.score;document.getElementById("rl").textContent=t.round;document.getElementById("hl").textContent=t.hits;document.getElementById("powerLabel").textContent=t.power;start.textContent=t.start;fire.textContent=t.fire;document.getElementById("instructions").innerHTML=t.instructions;if(!playing)message.textContent=t.ready});
placeTarget();
</script>
</body>
</html>
