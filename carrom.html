<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK2N Studio - Carrom</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 18px;

    font-family: Georgia, "Times New Roman", serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #395744 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #5b3025 0%, transparent 35%),
        linear-gradient(135deg, #172d2b, #251813);

    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 950px;
}

.logo {
    text-align: center;
    margin-bottom: 10px;
}

.logo h1 {
    margin: 0;
    color: #e5bd55;
    font-size: clamp(30px, 7vw, 56px);
    letter-spacing: 6px;
    text-shadow: 0 3px 12px #000;
}

.logo div {
    color: #b98a39;
    letter-spacing: 5px;
    margin-top: 5px;
}

.language-box {
    text-align: center;
    margin-bottom: 14px;
}

.language-button {
    padding: 8px 20px;
    border: 2px solid #d5ad4c;
    border-radius: 20px;
    background: #24473e;
    color: #f0d274;
    cursor: pointer;
}

/* MAIN */

.layout {
    display: grid;
    grid-template-columns: minmax(350px, 650px) 220px;
    gap: 20px;
    justify-content: center;
    align-items: start;
}

/* BOARD FRAME */

.board-frame {
    padding: 14px;

    border-radius: 20px;

    background:
        repeating-linear-gradient(
            45deg,
            #5b211e 0px,
            #5b211e 7px,
            #a27628 7px,
            #a27628 10px,
            #245047 10px,
            #245047 14px
        );

    border: 4px solid #d1a846;

    box-shadow: 0 20px 45px #000c;
}

/* BOARD */

.board {
    position: relative;

    width: 100%;
    aspect-ratio: 1 / 1;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #dec88e,
            #b8944e
        );

    border: 9px solid #382116;

    box-shadow:
        inset 0 0 0 3px #c49a43;
}

/* Decorative lines */

.board::before,
.board::after {
    content: "";
    position: absolute;

    border: 2px solid #7b4b29;

    pointer-events: none;
}

.board::before {
    inset: 10%;
}

.board::after {
    inset: 18%;

    border-radius: 50%;
}

/* POCKETS */

.pocket {
    position: absolute;

    width: 8%;
    aspect-ratio: 1;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #050505 0%,
            #111 55%,
            #4d351b 70%,
            #17100b 100%
        );

    box-shadow:
        inset 0 2px 5px #000,
        0 2px 4px #0008;

    z-index: 20;
}

.pocket.tl {
    top: 2%;
    left: 2%;
}

.pocket.tr {
    top: 2%;
    right: 2%;
}

.pocket.bl {
    bottom: 2%;
    left: 2%;
}

.pocket.br {
    bottom: 2%;
    right: 2%;
}

/* CENTER */

.center-circle {
    position: absolute;

    width: 28%;
    aspect-ratio: 1;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid #864d2b;
    border-radius: 50%;
}

.center-circle::after {
    content: "◆";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: #9d2d20;
}

/* COINS */

.piece {
    position: absolute;

    width: 5.4%;
    aspect-ratio: 1;

    border-radius: 50%;

    transform: translate(-50%, -50%);

    z-index: 10;

    box-shadow:
        2px 3px 5px #0009,
        inset 0 1px 2px #fff8;

    pointer-events: none;
}

.black {
    background:
        radial-gradient(
            circle at 35% 30%,
            #666,
            #222 50%,
            #050505
        );

    border: 2px solid #111;
}

.white {
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ddd 55%,
            #999
        );

    border: 2px solid #777;
}

.queen {
    background:
        radial-gradient(
            circle at 35% 30%,
            #ff8b78,
            #c52e22 55%,
            #68150e
        );

    border: 2px solid #69170f;
}

/* STRIKER */

#striker {
    position: absolute;

    width: 7%;
    aspect-ratio: 1;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff6d5,
            #d6b86e 55%,
            #805d29
        );

    border: 3px solid #633f20;

    box-shadow:
        2px 4px 6px #0009,
        inset 0 1px 2px #fff;

    transform: translate(-50%, -50%);

    z-index: 30;

    cursor: grab;
}

#striker:active {
    cursor: grabbing;
}

/* AIM */

#aimLine {
    position: absolute;

    height: 3px;

    background: #8e3024;

    transform-origin: left center;

    z-index: 25;

    pointer-events: none;

    display: none;
}

/* PANEL */

.panel {
    padding: 15px;

    border: 3px solid #8d682b;
    border-radius: 15px;

    background:
        linear-gradient(145deg, #402619, #21150e);

    box-shadow:
        0 10px 25px #0009,
        inset 0 0 0 2px #5e3d20;

    text-align: center;
}

.turn-label {
    color: #d8b85a;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.current-player {
    color: #f0d274;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

.player-card {
    padding: 11px;
    margin-bottom: 10px;

    border: 2px solid #735329;
    border-radius: 10px;

    background: rgba(0,0,0,.25);

    transition: .2s;
}

.player-card.active {
    border-color: #e0b957;

    box-shadow:
        0 0 12px rgba(216,169,52,.35);

    transform: scale(1.02);
}

.player-name {
    color: #e5cf9d;
    font-weight: bold;
}

.score {
    margin-top: 5px;
    color: #f0d274;
    font-size: 25px;
}

.status {
    min-height: 90px;

    color: #e9d9ac;

    font-size: 13px;

    line-height: 1.5;
}

.new-game {
    width: 100%;

    padding: 12px;

    border-radius: 9px;

    border: 2px solid #e0b957;

    background:
        linear-gradient(#a93427, #6e1f1a);

    color: white;

    font-family: Georgia, serif;

    font-weight: bold;

    cursor: pointer;
}

.new-game:hover {
    filter: brightness(1.15);
}

.instructions {
    margin-top: 12px;

    color: #cdbb91;

    font-size: 11px;

    line-height: 1.6;
}

.footer {
    text-align: center;

    margin-top: 14px;

    color: #d7c18b;

    font-size: 12px;

    letter-spacing: 2px;
}

/* MOBILE */

@media (max-width: 800px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        width: 100%;
        max-width: 600px;
        margin: auto;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="logo">
        <h1>PK2N STUDIO</h1>
        <div>◆ ── ◆ ── ◆</div>
    </div>

    <div class="language-box">
        <button
            id="languageButton"
            class="language-button">
            پښتو
        </button>
    </div>

    <div class="layout">

        <!-- BOARD -->

        <div class="board-frame">

            <div id="board" class="board">

                <div class="pocket tl"></div>
                <div class="pocket tr"></div>
                <div class="pocket bl"></div>
                <div class="pocket br"></div>

                <div class="center-circle"></div>

                <div id="aimLine"></div>

                <div id="striker"></div>

            </div>

        </div>

        <!-- PANEL -->

        <div class="panel">

            <div
                id="turnLabel"
                class="turn-label">
                CURRENT TURN
            </div>

            <div
                id="currentPlayer"
                class="current-player">
                PLAYER 1
            </div>

            <div
                id="player1Card"
                class="player-card active">

                <div
                    id="player1Name"
                    class="player-name">
                    PLAYER 1
                </div>

                <div
                    id="score1"
                    class="score">
                    0
                </div>

            </div>

            <div
                id="player2Card"
                class="player-card">

                <div
                    id="player2Name"
                    class="player-name">
                    PLAYER 2
                </div>

                <div
                    id="score2"
                    class="score">
                    0
                </div>

            </div>

            <div
                id="status"
                class="status">
                Drag backwards from the striker
                and release to shoot.
            </div>

            <button
                id="newGame"
                class="new-game">
                ↻ NEW GAME
            </button>

            <div
                id="instructions"
                class="instructions">

                Drag backwards from the striker
                to aim.
                <br><br>
                Release to shoot.
                <br><br>
                Pocket a coin to score.

            </div>

        </div>

    </div>

    <div class="footer">
        PK2N STUDIO
    </div>

</div>


<script>

/* =====================================================
   BASIC CARROM PHYSICS
===================================================== */

const board =
    document.getElementById("board");

const strikerElement =
    document.getElementById("striker");

const aimLine =
    document.getElementById("aimLine");

const statusElement =
    document.getElementById("status");

const currentPlayerElement =
    document.getElementById("currentPlayer");

const score1Element =
    document.getElementById("score1");

const score2Element =
    document.getElementById("score2");

const player1Card =
    document.getElementById("player1Card");

const player2Card =
    document.getElementById("player2Card");

const languageButton =
    document.getElementById("languageButton");

const newGameButton =
    document.getElementById("newGame");

const turnLabel =
    document.getElementById("turnLabel");

const player1Name =
    document.getElementById("player1Name");

const player2Name =
    document.getElementById("player2Name");

const instructions =
    document.getElementById("instructions");


/* =====================================================
   GAME STATE
===================================================== */

let pieces = [];

let currentPlayer = 1;

let score1 = 0;
let score2 = 0;

let moving = false;

let dragging = false;

let language = "en";

let striker = {
    x: 50,
    y: 88,
    vx: 0,
    vy: 0
};


/* =====================================================
   CONSTANTS
===================================================== */

const FRICTION = 0.985;

const WALL_BOUNCE = 0.82;

const PIECE_RADIUS = 2.7;

const STRIKER_RADIUS = 3.5;


/* =====================================================
   TRANSLATIONS
===================================================== */

const text = {

    en: {

        turn: "CURRENT TURN",

        player1: "PLAYER 1",

        player2: "PLAYER 2",

        status:
            "Drag backwards from the striker and release to shoot.",

        score:
            "Coin pocketed! Shoot again.",

        foul:
            "Striker pocketed. Turn changes.",

        newGame:
            "↻ NEW GAME",

        language:
            "پښتو",

        instructions:
            "Drag backwards from the striker to aim." +
            "<br><br>" +
            "Release to shoot." +
            "<br><br>" +
            "Pocket coins to score."

    },

    ps: {

        turn: "اوسنی وار",

        player1: "لوبغاړی ۱",

        player2: "لوبغاړی ۲",

        status:
            "له سټرایکر څخه شاته کش کړئ او خوشې یې کړئ.",

        score:
            "مهره جېب ته ولوېده! بیا ډز وکړئ.",

        foul:
            "سټرایکر جېب ته ولوېد. وار بدلېږي.",

        newGame:
            "↻ نوې لوبه",

        language:
            "English",

        instructions:
            "له سټرایکر څخه شاته کش کړئ." +
            "<br><br>" +
            "خپل ګوته خوشې کړئ چې ډز وکړئ." +
            "<br><br>" +
            "مهرې جېب ته واچوئ او نمرې واخلئ."

    }

};


/* =====================================================
   CREATE PIECE
===================================================== */

function createPiece(x, y, type) {

    const element =
        document.createElement("div");

    element.className =
        "piece " + type;

    board.appendChild(element);

    const piece = {

        element: element,

        x: x,
        y: y,

        vx: 0,
        vy: 0,

        type: type,

        active: true

    };

    pieces.push(piece);

    drawPiece(piece);

}


/* =====================================================
   CREATE ALL PIECES
===================================================== */

function createPieces() {

    document
        .querySelectorAll(".piece")
        .forEach(
            piece => piece.remove()
        );

    pieces = [];

    /* centre */

    createPiece(50, 50, "queen");

    /* surrounding black */

    createPiece(44, 50, "black");
    createPiece(56, 50, "black");

    createPiece(50, 44, "black");
    createPiece(50, 56, "black");

    createPiece(45.7, 45.7, "black");
    createPiece(54.3, 45.7, "black");

    createPiece(45.7, 54.3, "black");
    createPiece(54.3, 54.3, "black");

    /* white */

    createPiece(42, 46, "white");
    createPiece(58, 46, "white");

    createPiece(42, 54, "white");
    createPiece(58, 54, "white");

    createPiece(46, 42, "white");
    createPiece(54, 42, "white");

    createPiece(46, 58, "white");
    createPiece(54, 58, "white");

    createPiece(50, 40, "white");
    createPiece(50, 60, "white");

}


/* =====================================================
   DRAW PIECE
===================================================== */

function drawPiece(piece) {

    piece.element.style.left =
        piece.x + "%";

    piece.element.style.top =
        piece.y + "%";

}


/* =====================================================
   DRAW STRIKER
===================================================== */

function drawStriker() {

    strikerElement.style.left =
        striker.x + "%";

    strikerElement.style.top =
        striker.y + "%";

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame() {

    score1 = 0;
    score2 = 0;

    currentPlayer = 1;

    moving = false;

    striker.vx = 0;
    striker.vy = 0;

    striker.x = 50;
    striker.y = 88;

    createPieces();

    drawStriker();

    updateScores();

    updateTurn();

    statusElement.textContent =
        text[language].status;

}


/* =====================================================
   SCORE
===================================================== */

function updateScores() {

    score1Element.textContent =
        score1;

    score2Element.textContent =
        score2;

}


/* =====================================================
   TURN
===================================================== */

function updateTurn() {

    const t =
        text[language];

    turnLabel.textContent =
        t.turn;

    currentPlayerElement.textContent =
        currentPlayer === 1
            ? t.player1
            : t.player2;

    player1Name.textContent =
        t.player1;

    player2Name.textContent =
        t.player2;

    player1Card.classList.toggle(
        "active",
        currentPlayer === 1
    );

    player2Card.classList.toggle(
        "active",
        currentPlayer === 2
    );

}


/* =====================================================
   LANGUAGE
===================================================== */

languageButton.addEventListener(
    "click",
    () => {

        language =
            language === "en"
                ? "ps"
                : "en";

        document.documentElement.lang =
            language === "ps"
                ? "ps"
                : "en";

        document.documentElement.dir =
            language === "ps"
                ? "rtl"
                : "ltr";

        languageButton.textContent =
            text[language].language;

        newGameButton.textContent =
            text[language].newGame;

        instructions.innerHTML =
            text[language].instructions;

        updateTurn();

    }
);


/* =====================================================
   GET MOUSE POSITION
===================================================== */

function getPosition(event) {

    const rect =
        board.getBoundingClientRect();

    return {

        x:
            (event.clientX -
             rect.left) /
            rect.width *
            100,

        y:
            (event.clientY -
             rect.top) /
            rect.height *
            100

    };

}


/* =====================================================
   START AIMING
===================================================== */

board.addEventListener(
    "pointerdown",
    event => {

        if (moving)
            return;

        const pos =
            getPosition(event);

        const distance =
            Math.hypot(
                pos.x - striker.x,
                pos.y - striker.y
            );

        if (
            distance < 7
        ) {

            dragging = true;

            board.setPointerCapture(
                event.pointerId
            );

        }

    }
);


/* =====================================================
   AIM
===================================================== */

board.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;

        const pos =
            getPosition(event);

        const dx =
            striker.x - pos.x;

        const dy =
            striker.y - pos.y;

        const length =
            Math.hypot(dx, dy);

        if (length < 1)
            return;

        aimLine.style.display =
            "block";

        aimLine.style.left =
            striker.x + "%";

        aimLine.style.top =
            striker.y + "%";

        aimLine.style.width =
            Math.min(length, 25) + "%";

        aimLine.style.transform =
            `rotate(${Math.atan2(dy, dx) * 180 / Math.PI}deg)`;

    }
);


/* =====================================================
   SHOOT
===================================================== */

board.addEventListener(
    "pointerup",
    event => {

        if (!dragging)
            return;

        dragging = false;

        aimLine.style.display =
            "none";

        const pos =
            getPosition(event);

        let dx =
            striker.x - pos.x;

        let dy =
            striker.y - pos.y;

        let length =
            Math.hypot(dx, dy);

        if (length < 2)
            return;

        /* maximum shooting power */

        const power =
            Math.min(length * 0.55, 9);

        dx /= length;
        dy /= length;

        striker.vx =
            dx * power;

        striker.vy =
            dy * power;

        moving = true;

        requestAnimationFrame(
            gameLoop
        );

    }
);


/* =====================================================
   PHYSICS LOOP
===================================================== */

function gameLoop() {

    if (!moving)
        return;

    updateStriker();

    updatePieces();

    checkStrikerPieceCollisions();

    checkPieceCollisions();

    checkPockets();

    if (
        everythingStopped()
    ) {

        stopGame();

        return;

    }

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   MOVE STRIKER
===================================================== */

function updateStriker() {

    striker.x +=
        striker.vx;

    striker.y +=
        striker.vy;

    striker.vx *=
        FRICTION;

    striker.vy *=
        FRICTION;

    bounceObject(
        striker,
        STRIKER_RADIUS
    );

    drawStriker();

}


/* =====================================================
   MOVE ALL COINS
===================================================== */

function updatePieces() {

    pieces.forEach(
        piece => {

            if (!piece.active)
                return;

            piece.x +=
                piece.vx;

            piece.y +=
                piece.vy;

            piece.vx *=
                FRICTION;

            piece.vy *=
                FRICTION;

            bounceObject(
                piece,
                PIECE_RADIUS
            );

            drawPiece(piece);

        }
    );

}


/* =====================================================
   WALL BOUNCING
===================================================== */

function bounceObject(
    object,
    radius
) {

    const min =
        11 + radius;

    const max =
        89 - radius;

    if (
        object.x < min
    ) {

        object.x = min;

        object.vx =
            Math.abs(object.vx) *
            WALL_BOUNCE;

    }

    if (
        object.x > max
    ) {

        object.x = max;

        object.vx =
            -Math.abs(object.vx) *
            WALL_BOUNCE;

    }

    if (
        object.y < min
    ) {

        object.y = min;

        object.vy =
            Math.abs(object.vy) *
            WALL_BOUNCE;

    }

    if (
        object.y > max
    ) {

        object.y = max;

        object.vy =
            -Math.abs(object.vy) *
            WALL_BOUNCE;

    }

}


/* =====================================================
   STRIKER → PIECES
===================================================== */

function checkStrikerPieceCollisions() {

    pieces.forEach(
        piece => {

            if (!piece.active)
                return;

            collide(
                striker,
                STRIKER_RADIUS,
                piece,
                PIECE_RADIUS
            );

        }
    );

}


/* =====================================================
   PIECE → PIECE
===================================================== */

function checkPieceCollisions() {

    for (
        let i = 0;
        i < pieces.length;
        i++
    ) {

        if (!pieces[i].active)
            continue;

        for (
            let j = i + 1;
            j < pieces.length;
            j++
        ) {

            if (!pieces[j].active)
                continue;

            collide(
                pieces[i],
                PIECE_RADIUS,
                pieces[j],
                PIECE_RADIUS
            );

        }

    }

}


/* =====================================================
   COLLISION
===================================================== */

function collide(
    a,
    radiusA,
    b,
    radiusB
) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;

    const distance =
        Math.hypot(dx, dy);

    const minimum =
        radiusA + radiusB;

    if (
        distance === 0 ||
        distance >= minimum
    )
        return;

    const nx =
        dx / distance;

    const ny =
        dy / distance;

    /* Separate objects */

    const overlap =
        minimum - distance;

    a.x -=
        nx *
        overlap /
        2;

    a.y -=
        ny *
        overlap /
        2;

    b.x +=
        nx *
        overlap /
        2;

    b.y +=
        ny *
        overlap /
        2;

    /* Relative velocity */

    const rvx =
        b.vx - a.vx;

    const rvy =
        b.vy - a.vy;

    const velocityAlongNormal =
        rvx * nx +
        rvy * ny;

    if (
        velocityAlongNormal > 0
    )
        return;

    const impulse =
        -velocityAlongNormal;

    const impulseX =
        impulse * nx;

    const impulseY =
        impulse * ny;

    a.vx -=
        impulseX;

    a.vy -=
        impulseY;

    b.vx +=
        impulseX;

    b.vy +=
        impulseY;

}


/* =====================================================
   POCKET DETECTION
===================================================== */

function checkPockets() {

    const pockets = [

        { x: 5, y: 5 },

        { x: 95, y: 5 },

        { x: 5, y: 95 },

        { x: 95, y: 95 }

    ];

    pieces.forEach(
        piece => {

            if (!piece.active)
                return;

            for (
                const pocket of pockets
            ) {

                const distance =
                    Math.hypot(
                        piece.x -
                        pocket.x,

                        piece.y -
                        pocket.y
                    );

                if (
                    distance < 6
                ) {

                    pocketPiece(
                        piece
                    );

                    break;

                }

            }

        }
    );


    /* striker */

    for (
        const pocket of pockets
    ) {

        const distance =
            Math.hypot(
                striker.x -
                pocket.x,

                striker.y -
                pocket.y
            );

        if (
            distance < 6
        ) {

            striker.x = 50;
            striker.y = 88;

            striker.vx = 0;
            striker.vy = 0;

            statusElement.textContent =
                text[language].foul;

            break;

        }

    }

}


/* =====================================================
   POCKET A PIECE
===================================================== */

function pocketPiece(piece) {

    piece.active = false;

    piece.vx = 0;
    piece.vy = 0;

    piece.element.style.display =
        "none";

    let points = 1;

    if (
        piece.type === "queen"
    ) {

        points = 3;

    }

    if (
        currentPlayer === 1
    ) {

        score1 += points;

    } else {

        score2 += points;

    }

    updateScores();

    statusElement.textContent =
        text[language].score;

}


/* =====================================================
   CHECK IF EVERYTHING STOPPED
===================================================== */

function everythingStopped() {

    const strikerSpeed =
        Math.hypot(
            striker.vx,
            striker.vy
        );

    if (
        strikerSpeed > 0.08
    )
        return false;

    for (
        const piece of pieces
    ) {

        if (!piece.active)
            continue;

        const speed =
            Math.hypot(
                piece.vx,
                piece.vy
            );

        if (
            speed > 0.08
        )
            return false;

    }

    return true;

}


/* =====================================================
   END SHOT
===================================================== */

function stopGame() {

    moving = false;

    striker.vx = 0;
    striker.vy = 0;

    pieces.forEach(
        piece => {

            piece.vx = 0;
            piece.vy = 0;

        }
    );

    striker.x = 50;
    striker.y = 88;

    drawStriker();

    currentPlayer =
        currentPlayer === 1
            ? 2
            : 1;

    updateTurn();

}


/* =====================================================
   NEW GAME BUTTON
===================================================== */

newGameButton.addEventListener(
    "click",
    newGame
);


/* =====================================================
   START
===================================================== */

newGame();

</script>
