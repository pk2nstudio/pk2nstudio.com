<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK2N Ludo</title>

<style>

/* =====================================================
   PK2N LUDO
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #fff;

    background:
        linear-gradient(
            rgba(15,35,30,.65),
            rgba(15,35,30,.75)
        ),
        linear-gradient(
            135deg,
            #304b3d,
            #172d2b 50%,
            #3d2d20
        );

    display: flex;

    justify-content: center;

    padding: 25px;

}

.game {

    width: 100%;

    max-width: 1250px;

}


/* =====================================================
   HEADER
===================================================== */

.logo {

    text-align: center;

    margin-bottom: 22px;

}

.logo h1 {

    margin: 0;

    font-size: clamp(32px,5vw,58px);

    letter-spacing: 5px;

    color: #e5b94c;

    text-shadow:
        0 3px 0 #4a2d13,
        0 6px 12px #000;

}

.logo p {

    margin: 5px 0 0;

    letter-spacing: 4px;

    color: #e7d5a5;

    font-size: 15px;

}


/* =====================================================
   GAME AREA
===================================================== */

.game-area {

    display: grid;

    grid-template-columns:
        190px
        minmax(400px,650px)
        220px;

    gap: 18px;

    justify-content: center;

    align-items: start;

}


/* =====================================================
   PLAYERS
===================================================== */

.players {

    display: flex;

    flex-direction: column;

    gap: 15px;

}

.player-card {

    border: 3px solid #8d682b;

    border-radius: 12px;

    padding: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(45,25,12,.95),
            rgba(75,45,20,.95)
        );

    box-shadow:
        0 7px 15px #0009,
        inset 0 0 0 2px #3d2412;

}

.player-title {

    display: flex;

    align-items: center;

    gap: 9px;

    font-weight: bold;

    font-size: 18px;

}

.player-number {

    color: #d9bd70;

    font-size: 13px;

    margin-top: 4px;

}

.player-pieces {

    display: flex;

    gap: 5px;

    margin-top: 10px;

}

.mini-piece {

    width: 17px;

    height: 17px;

    border-radius: 50%;

    border: 2px solid #f6e7bb;

}

.red-piece {
    background:#a93226;
}

.green-piece {
    background:#247a43;
}

.yellow-piece {
    background:#d49c16;
}

.blue-piece {
    background:#28679b;
}


/* =====================================================
   BOARD FRAME
===================================================== */

.board-frame {

    padding: 12px;

    border-radius: 22px;

    background:

        repeating-linear-gradient(
            45deg,
            #5b3518 0px,
            #5b3518 8px,
            #8b5b29 8px,
            #8b5b29 12px
        );

    border: 4px solid #c79a42;

    box-shadow:
        0 20px 45px #000b,
        inset 0 0 0 4px #432512;

}


/* =====================================================
   BOARD
===================================================== */

.board {

    width: 100%;

    aspect-ratio: 1;

    display: grid;

    grid-template-columns:
        repeat(11,1fr);

    grid-template-rows:
        repeat(11,1fr);

    overflow: hidden;

    border: 5px solid #3c2514;

    background: #e5d1a0;

}


/* =====================================================
   CELLS
===================================================== */

.cell {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    border: 1px solid #b08a4d;

}


/* =====================================================
   ROUTE PATTERN
===================================================== */

.path {

    background-color: #f1dfb8;

    background-image:

        linear-gradient(
            45deg,
            transparent 42%,
            rgba(115,78,31,.28) 43%,
            rgba(115,78,31,.28) 48%,
            transparent 49%
        ),

        linear-gradient(
            -45deg,
            transparent 42%,
            rgba(115,78,31,.28) 43%,
            rgba(115,78,31,.28) 48%,
            transparent 49%
        );

    background-size: 15px 15px;

}


/* =====================================================
   ALTERNATING ROUTE DESIGN
===================================================== */

.path:nth-child(2n) {

    background-color: #e8d0a0;

    background-image:

        radial-gradient(
            circle at center,
            rgba(101,67,27,.30) 2px,
            transparent 3px
        ),

        linear-gradient(
            90deg,
            transparent 45%,
            rgba(101,67,27,.16) 46%,
            rgba(101,67,27,.16) 54%,
            transparent 55%
        );

    background-size:
        13px 13px,
        13px 13px;

}


.path::before {

    content: "◆";

    position: absolute;

    font-size: 9px;

    color: rgba(96,63,26,.38);

    z-index: 1;

}


/* =====================================================
   HOME AREAS
===================================================== */

.redHome {

    background:
        repeating-linear-gradient(
            45deg,
            #70261f,
            #70261f 5px,
            #8e3328 5px,
            #8e3328 10px
        );

}

.greenHome {

    background:
        repeating-linear-gradient(
            45deg,
            #205c34,
            #205c34 5px,
            #2c7542 5px,
            #2c7542 10px
        );

}

.yellowHome {

    background:
        repeating-linear-gradient(
            45deg,
            #a87513,
            #a87513 5px,
            #c18d20 5px,
            #c18d20 10px
        );

}

.blueHome {

    background:
        repeating-linear-gradient(
            45deg,
            #234e72,
            #234e72 5px,
            #2c638d 5px,
            #2c638d 10px
        );

}


.redHome::before,
.greenHome::before,
.yellowHome::before,
.blueHome::before {

    content: "◆";

    position: absolute;

    font-size: 9px;

    color: #f2d98d;

    opacity: .7;

}


/* =====================================================
   CENTRE
===================================================== */

.center {

    background:
        radial-gradient(
            circle,
            #7b5628,
            #3d2615
        );

}


.logo-cell {

    color: #e9c45f;

    font-weight: bold;

    font-size:
        clamp(11px,2vw,22px);

    text-align: center;

    letter-spacing: 1px;

    text-shadow:
        0 2px 3px #000;

}


/* =====================================================
   SAFE SPACES
===================================================== */

.safe {

    background:
        radial-gradient(
            circle,
            #f4df9e,
            #c99e48
        );

}

.safe::after {

    content: "✦";

    color: #6c461d;

    font-size: 19px;

    font-weight: bold;

}


/* =====================================================
   PIECES
===================================================== */

.piece {

    width: 68%;

    height: 68%;

    border-radius: 50%;

    border:
        3px solid #f7e6b1;

    box-shadow:

        0 3px 5px #000b,

        inset
        0 2px 3px
        #ffffff88;

    z-index: 10;

    position: relative;

}


.piece.red {

    background:
        radial-gradient(
            circle at 35% 30%,
            #e47767,
            #8e261e
        );

}

.piece.green {

    background:
        radial-gradient(
            circle at 35% 30%,
            #70bd7b,
            #236b38
        );

}

.piece.yellow {

    background:
        radial-gradient(
            circle at 35% 30%,
            #f6db70,
            #b37a0e
        );

}

.piece.blue {

    background:
        radial-gradient(
            circle at 35% 30%,
            #72acd1,
            #245a86
        );

}


/* =====================================================
   CONTROL PANEL
===================================================== */

.controls {

    border:
        3px solid #8d682b;

    border-radius: 15px;

    padding: 18px;

    background:
        linear-gradient(
            145deg,
            #3e2817,
            #21150e
        );

    box-shadow:

        0 10px 25px #0009,

        inset
        0 0 0 2px
        #5e3d20;

    text-align: center;

}


.current-label {

    color: #d8b85a;

    letter-spacing: 2px;

    font-size: 13px;

    margin-bottom: 8px;

}

.current-player {

    font-size: 27px;

    font-weight: bold;

    margin-bottom: 20px;

}


/* =====================================================
   DICE
===================================================== */

.dice {

    width: 90px;

    height: 90px;

    margin: auto;

    background:
        linear-gradient(
            145deg,
            #fff,
            #d4d4d4
        );

    color: #222;

    border-radius: 15px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 57px;

    box-shadow:
        0 8px 15px #0009;

    border:
        3px solid #c9a54e;

}


/* =====================================================
   DICE ROLLING ANIMATION
===================================================== */

.dice.rolling {

    animation:
        diceRoll .12s
        linear infinite;

}


@keyframes diceRoll {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(8deg);
    }

    50% {
        transform: rotate(-8deg);
    }

    75% {
        transform: rotate(5deg);
    }

    100% {
        transform: rotate(0deg);
    }

}


/* =====================================================
   BUTTONS
===================================================== */

button {

    width: 100%;

    margin-top: 18px;

    padding: 14px;

    border-radius: 9px;

    border:
        2px solid #e0b957;

    background:
        linear-gradient(
            #b6402f,
            #79231b
        );

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 5px 10px #0008;

}


button:hover {

    filter: brightness(1.2);

}


button:disabled {

    opacity: .5;

    cursor: not-allowed;

}


.new-game {

    background:
        linear-gradient(
            #6f562b,
            #453216
        );

}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    min-height: 70px;

    margin-top: 15px;

    color: #e9d9ac;

    font-size: 14px;

    line-height: 1.5;

}


/* =====================================================
   DECORATION
===================================================== */

.pattern {

    text-align: center;

    color: #b98a39;

    letter-spacing: 5px;

    margin: 14px 0;

}


.footer {

    text-align: center;

    margin-top: 20px;

    color: #d7c18b;

    font-size: 13px;

    letter-spacing: 2px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:950px) {

    .game-area {

        grid-template-columns:
            1fr;

        max-width: 650px;

        margin: auto;

    }

    .players {

        display: grid;

        grid-template-columns:
            repeat(4,1fr);

    }

    .controls {

        max-width: 400px;

        width: 100%;

        margin: auto;

    }

}


@media(max-width:600px) {

    body {

        padding: 10px;

    }

    .players {

        grid-template-columns:
            repeat(2,1fr);

    }

    .logo h1 {

        font-size: 32px;

    }

}

</style>
</head>


<body>


<div class="game">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="logo">

    <h1>PK2N LUDO</h1>

    <p>
        KHYBER • PASHTUN • PRIDE
    </p>

</div>


<div class="game-area">


<!-- =====================================================
     PLAYER CARDS
===================================================== -->

<div class="players">


<div class="player-card">

    <div class="player-title">

        <span class="mini-piece red-piece"></span>

    </div>

    <div class="player-number">

    </div>

    <div class="player-pieces">

        <span class="mini-piece red-piece"></span>

</div>

    <div class="player-title">

    </div>

    <div class="player-number">

    </div>

    <div class="player-pieces">

        <span class="mini-piece green-piece"></span>
        <span class="mini-piece green-piece"></span>
        <span class="mini-piece green-piece"></span>
        <span class="mini-piece green-piece"></span>

    </div>

</div>


<div class="player-card">

    <div class="player-title">

        <span class="mini-piece yellow-piece"></span>

        YELLOW

    </div>

    <div class="player-number">
        Player 3
    </div>

    <div class="player-pieces">

        <span class="mini-piece yellow-piece"></span>
        <span class="mini-piece yellow-piece"></span>
        <span class="mini-piece yellow-piece"></span>
        <span class="mini-piece yellow-piece"></span>

    </div>

</div>


<div class="player-card">

    <div class="player-title">

        <span class="mini-piece blue-piece"></span>

        BLUE

    </div>

    <div class="player-number">
        Player 4
    </div>

    <div class="player-pieces">

        <span class="mini-piece blue-piece"></span>
        <span class="mini-piece blue-piece"></span>
        <span class="mini-piece blue-piece"></span>
        <span class="mini-piece blue-piece"></span>

    </div>

</div>

        class="board">

    </div>

</div>

    •

<script>

/* =====================================================
   PK2N LUDO GAME
===================================================== */


/* ELEMENTS */

const board =
    document.getElementById("board");

const dice =
    document.getElementById("dice");

const turn =
    document.getElementById("turn");

const message =
    document.getElementById("message");

const rollButton =
    document.getElementById("rollButton");

const newGame =
    document.getElementById("newGame");


/* =====================================================
   PLAYERS
===================================================== */

const players = [

    {
        name: "Red",
        colour: "red",
        start: 0,
        position: -1
    },

    {
        name: "Green",
        colour: "green",
        start: 10,
        position: -1
    },

    {
        name: "Yellow",
        colour: "yellow",
        start: 20,
        position: -1
    },

    {
        name: "Blue",
        colour: "blue",
        start: 30,
        position: -1
    }

];


let currentPlayer = 0;

let gameFinished = false;

let rolling = false;


/* =====================================================
   ROUTE
===================================================== */

const route = [

    [0,4],
    [0,5],
    [0,6],

    [1,6],
    [2,6],
    [3,6],

    [4,6],
    [4,7],
    [4,8],
    [4,9],
    [4,10],

    [5,10],

    [6,10],
    [6,9],
    [6,8],
    [6,7],
    [6,6],

    [7,6],
    [8,6],
    [9,6],
    [10,6],

    [10,5],
    [10,4],

    [9,4],
    [8,4],
    [7,4],
    [6,4],

    [6,3],
    [6,2],
    [6,1],
    [6,0],

    [5,0],

    [4,0],
    [4,1],
    [4,2],
    [4,3],
    [4,4],

    [3,4],
    [2,4],
    [1,4]

];


/* =====================================================
   HOMES
===================================================== */

const homes = {

    red: [
        [1,1],
        [1,2],
        [2,1],
        [2,2]
    ],

    green: [
        [1,8],
        [1,9],
        [2,8],
        [2,9]
    ],

    yellow: [
        [8,1],
        [8,2],
        [9,1],
        [9,2]
    ],

    blue: [
        [8,8],
        [8,9],
        [9,8],
        [9,9]
    ]

};


/* =====================================================
   DICE FACES
===================================================== */

const diceFaces = [

    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"

];


/* =====================================================
   CREATE BOARD
===================================================== */

function createBoard() {

    board.innerHTML = "";


    const routeCells =
        new Set();


    route.forEach(position => {

        routeCells.add(

            position[0] +
            "-" +
            position[1]

        );

    });


    for(
        let row = 0;
        row < 11;
        row++
    ) {

        for(
            let column = 0;
            column < 11;
            column++
        ) {


            const cell =
                document.createElement("div");


            cell.className =
                "cell";


            const key =
                row +
                "-" +
                column;


            /* ROUTE */

            if(
                routeCells.has(key)
            ) {

                cell.classList.add(
                    "path"
                );

            }


            /* HOMES */

            for(
                const colour in homes
            ) {

                homes[colour].forEach(
                    position => {

                        if(

                            position[0] === row &&

                            position[1] === column

                        ) {

                            cell.classList.add(
                                colour + "Home"
                            );

                        }

                    }
                );

            }


            /* CENTRE */

            if(

                row >= 4 &&
                row <= 6 &&
                column >= 4 &&
                column <= 6

            ) {

                cell.classList.add(
                    "center"
                );

            }


            /* SAFE SPACES */

            if(

                (row === 2 &&
                 column === 4)

                ||

                (row === 4 &&
                 column === 8)

                ||

                (row === 8 &&
                 column === 6)

                ||

                (row === 6 &&
                 column === 2)

            ) {

                cell.classList.add(
                    "safe"
                );

            }


            /* CENTRE LOGO */

            if(

                row === 5 &&
                column === 5

            ) {

                cell.innerHTML =

                    `
                    <div class="logo-cell">
                        PK2N<br>
                        STUDIO
                    </div>
                    `;

            }


            board.appendChild(
                cell
            );

        }

    }


    drawPieces();

}


/* =====================================================
   DRAW PIECES
===================================================== */

function drawPieces() {

    document
        .querySelectorAll(".piece")
        .forEach(
            piece =>
                piece.remove()
        );


    players.forEach(
        player => {


            let row;

            let column;


            /* HOME */

            if(
                player.position === -1
            ) {

                const home =
                    homes[
                        player.colour
                    ][0];


                row =
                    home[0];

                column =
                    home[1];

            }


            /* BOARD */

            else {

                const routePosition =

                    (
                        player.start +
                        player.position
                    )
                    %
                    route.length;


                row =
                    route[
                        routePosition
                    ][0];


                column =
                    route[
                        routePosition
                    ][1];

            }


            const cell =
                board.children[
                    row * 11 +
                    column
                ];


            const piece =
                document.createElement(
                    "div"
                );


            piece.className =
                "piece " +
                player.colour;


            cell.appendChild(
                piece
            );

        }
    );

}


/* =====================================================
   TURN DISPLAY
===================================================== */

function updateTurn() {

    const player =
        players[
            currentPlayer
        ];


    let icon = "🔴";


    if(
        player.colour === "green"
    ) {

        icon = "🟢";

    }


    if(
        player.colour === "yellow"
    ) {

        icon = "🟡";

    }


    if(
        player.colour === "blue"
    ) {

        icon = "🔵";

    }


    turn.textContent =
        icon +
        " " +
        player.name;

}


/* =====================================================
   ROLL DICE
===================================================== */

function rollDice() {


    if(
        gameFinished ||
        rolling
    ) {

        return;

    }


    rolling = true;

    rollButton.disabled = true;

    dice.classList.add(
        "rolling"
    );


    /*
       Create a short rolling animation.
       The actual result is selected first.
    */

    const result =
        Math.floor(
            Math.random() * 6
        ) + 1;


    let animationCount = 0;


    const animation =
        setInterval(() => {


            const randomFace =
                Math.floor(
                    Math.random() * 6
                );


            dice.textContent =
                diceFaces[randomFace];


            animationCount++;


            if(
                animationCount >= 10
            ) {

                clearInterval(
                    animation
                );


                dice.classList.remove(
                    "rolling"
                );


                dice.textContent =
                    diceFaces[
                        result - 1
                    ];


                finishRoll(
                    result
                );

            }


        }, 100);

}


/* =====================================================
   FINISH DICE ROLL
===================================================== */

function finishRoll(number) {


    const player =
        players[
            currentPlayer
        ];


    /* =================================================
       PLAYER AT HOME
    ================================================= */

    if(
        player.position === -1
    ) {


        if(
            number === 6
        ) {

            player.position = 0;


            message.textContent =
                "🎉 " +
                player.name +
                " rolled a 6 and entered the board!";


        }

        else {

            message.textContent =
                player.name +
                " rolled " +
                number +
                ". You need a 6 to enter.";

        }

    }


    /* =================================================
       PLAYER ON BOARD
    ================================================= */

    else {


        player.position +=
            number;


        /* WIN */

        if(
            player.position >=
            route.length
        ) {


            drawPieces();


            message.textContent =
                "🏆 " +
                player.name +
                " WINS!";


            turn.textContent =
                player.name +
                " is the winner!";


            gameFinished =
                true;


            rolling = false;


            return;

        }


        message.textContent =
            player.name +
            " rolled " +
            number +
            " and moved " +
            number +
            " spaces.";


        checkCapture(
            player
        );

    }


    drawPieces();


    /* =================================================
       SIX = EXTRA TURN
    ================================================= */

    if(
        number === 6
    ) {

        message.textContent +=
            " 🎲 Roll again!";

    }

    else {

        currentPlayer++;


        if(
            currentPlayer >=
            players.length
        ) {

            currentPlayer = 0;

        }


        updateTurn();

    }


    rolling = false;

    rollButton.disabled = false;

}


/* =====================================================
   CAPTURE
===================================================== */

function checkCapture(
    activePlayer
) {


    if(
        activePlayer.position < 0
    ) {

        return;

    }


    const activePosition =

        (
            activePlayer.start +
            activePlayer.position
        )
        %
        route.length;


    players.forEach(
        player => {


            if(
                player ===
                activePlayer
            ) {

                return;

            }


            if(
                player.position < 0
            ) {

                return;

            }


            const playerPosition =

                (
                    player.start +
                    player.position
                )
                %
                route.length;


            if(

                activePosition ===
                playerPosition

            ) {


                player.position =
                    -1;


                message.textContent +=

                    " ⚔️ " +
                    player.name +
                    " was sent home!";

            }

        }
    );

}


/* =====================================================
   NEW GAME
===================================================== */

function resetGame() {


    players.forEach(
        player => {

            player.position =
                -1;

        }
    );


    currentPlayer = 0;

    gameFinished = false;

    rolling = false;


    rollButton.disabled =
        false;


    dice.classList.remove(
        "rolling"
    );


    dice.textContent =
        "⚄";


    message.textContent =
        "Roll the dice to begin!";


    updateTurn();


    createBoard();

}


/* =====================================================
   BUTTONS
===================================================== */

rollButton.addEventListener(
    "click",
    rollDice
);


newGame.addEventListener(
    "click",
    resetGame
);


/* =====================================================
   START GAME
===================================================== */

createBoard();

updateTurn();

</script>
